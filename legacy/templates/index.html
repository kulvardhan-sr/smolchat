<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Söhne', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #212121;
            color: #ececec;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2f2f2f;
            border-bottom: 1px solid #404040;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .chat-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #ececec;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #565869;
            color: #ececec;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #404040;
            border-color: #6e6e80;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: #212121;
        }

        .message {
            border-bottom: 1px solid #2f2f2f;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message-wrapper {
            max-width: 48rem;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            gap: 24px;
        }

        .user-message {
            background: #2f2f2f;
        }

        .assistant-message {
            background: #212121;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #19c37d;
            color: #fff;
        }

        .assistant-avatar {
            background: #ab68ff;
            color: #fff;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .markdown-body {
            background: transparent !important;
            color: #ececec !important;
            font-size: 16px;
            line-height: 1.75;
        }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body pre {
            background: #1a1a1a !important;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
        }

        .markdown-body code {
            background: #2f2f2f !important;
            color: #ececec !important;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        .markdown-body pre code {
            background: transparent !important;
            padding: 0;
            font-size: 14px;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: #ececec !important;
            border-bottom: none !important;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
            margin-bottom: 1em;
        }

        .markdown-body a {
            color: #58a6ff;
        }

        .markdown-body blockquote {
            border-left: 3px solid #404040;
            color: #999;
            padding-left: 16px;
            margin: 12px 0;
        }

        .chat-input-container {
            background: #212121;
            border-top: 1px solid #2f2f2f;
            padding: 20px;
        }

        .input-wrapper {
            max-width: 48rem;
            margin: 0 auto;
        }

        .chat-input-form {
            position: relative;
            display: flex;
            align-items: center;
            background: #2f2f2f;
            border: 1px solid #404040;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .chat-input-form:focus-within {
            border-color: #565869;
            box-shadow: 0 0 0 2px rgba(86, 88, 105, 0.1);
        }

        .chat-input {
            flex: 1;
            padding: 14px 50px 14px 16px;
            background: transparent;
            border: none;
            color: #ececec;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            resize: none;
            max-height: 200px;
        }

        .chat-input::placeholder {
            color: #8e8ea0;
        }

        .send-btn {
            position: absolute;
            right: 8px;
            background: #676767;
            color: #212121;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            background: #8e8ea0;
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            gap: 4px;
            padding: 8px 0;
            max-width: 48rem;
            margin: 0 auto;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8e8ea0;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #212121;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #565869;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>Qwen</h1>
        <button class="clear-btn" onclick="clearChat()">New Chat</button>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message assistant-message">
            <div class="message-wrapper">
                <div class="message-avatar assistant-avatar">Q</div>
                <div class="message-content">
                    <div class="markdown-body">
                        <p>Hello! I'm Qwen, your AI assistant. How can I help you today?</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="chat-input-container">
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        <div class="input-wrapper">
            <form class="chat-input-form" onsubmit="sendMessage(event)">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Message Qwen..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // Configure marked for syntax highlighting
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        const sessionId = 'session_' + Date.now();
        let isStreaming = false;

        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(content, isUser) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'message-wrapper';
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${isUser ? 'user-avatar' : 'assistant-avatar'}`;
            avatar.textContent = isUser ? 'U' : 'Q';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const markdownDiv = document.createElement('div');
            markdownDiv.className = 'markdown-body';
            markdownDiv.innerHTML = marked.parse(content);
            
            contentDiv.appendChild(markdownDiv);
            wrapperDiv.appendChild(avatar);
            wrapperDiv.appendChild(contentDiv);
            messageDiv.appendChild(wrapperDiv);
            chatMessages.appendChild(messageDiv);
            
            scrollToBottom();
            
            return markdownDiv;
        }

        async function sendMessage(event) {
            event.preventDefault();
            
            if (isStreaming) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            input.value = '';
            
            // Disable input
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('messageInput').disabled = true;
            document.getElementById('typingIndicator').classList.add('active');
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                let assistantContent = '';
                let assistantMessageDiv = null;
                
                document.getElementById('typingIndicator').classList.remove('active');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));
                            
                            if (data.content) {
                                assistantContent += data.content;
                                
                                if (!assistantMessageDiv) {
                                    assistantMessageDiv = addMessage(assistantContent, false);
                                } else {
                                    assistantMessageDiv.innerHTML = marked.parse(assistantContent);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage('Sorry, there was an error processing your request.', false);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('messageInput').disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        async function clearChat() {
            if (!confirm('Are you sure you want to clear the chat history?')) {
                return;
            }
            
            try {
                await fetch('/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = `
                    <div class="message assistant-message">
                        <div class="message-wrapper">
                            <div class="message-avatar assistant-avatar">Q</div>
                            <div class="message-content">
                                <div class="markdown-body">
                                    <p>Hello! I'm Qwen, your AI assistant. How can I help you today?</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }

        // Focus input on load
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
